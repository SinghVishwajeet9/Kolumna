# Runs on every push and pull request: typecheck the API and the web app,
# then run the API test suite against a fresh, throwaway Postgres that
# exists only for this run. Tests never see a real database (tests/guard.ts
# refuses any database whose name doesn't end in "_test").

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kolumna_test
          POSTGRES_PASSWORD: kolumna_test
          POSTGRES_DB: kolumna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kolumna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KOLUMNA_TEST_ENV_FROM_CI: "1"
      DATABASE_URL: postgresql://kolumna_test:kolumna_test@localhost:5432/kolumna_test
      # Required by src/lib/env.ts; the tests don't use Redis.
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: bunx prisma generate

      - name: Typecheck API
        working-directory: apps/api
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Typecheck web
        working-directory: apps/web
        run: bunx tsc --noEmit

      - name: Test API
        working-directory: apps/api
        run: bunx vitest run
